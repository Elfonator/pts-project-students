# Application configuration
base.url=http://127.0.0.1:8080/
browser=chrome
headless=false
timeout.seconds=30
cleanup.order=true
driver.path=
browser.binary=

# Read-only JDBC (GUI + DB tests). Docker compose maps host 3307 -> container 3306.
# Prefer a SELECT-only account -> see database/create-readonly-user.sql
db.url=jdbc:mariadb://127.0.0.1:3307/testlab_shop?connectTimeout=5000&socketTimeout=10000
db.user=testlab_reader
db.password=SEM_DB_READER_PASSWORD

# api = auto create/delete run-* (needs Docker test API)
# manual = reuse test.email/password below
fixtures.mode=manual
allow.http=true

# Required when fixtures.mode=api (same value as Docker TEST_API_KEY, at least 32 chars)
# Prefer env TEST_API_KEY in CI; generate: php -r "echo bin2hex(random_bytes(32)), PHP_EOL;"
test.api.key=SEM_NAHODNY_KLUC_ASPON_32_ZNAKOV

# Used when fixtures.mode=manual, and for ordinary GUI tests that do not call ApiFixtureHelper
test.email=SEM_EMAIL
test.password=SEM_PASSWORD
test.workspace=SEM_WORKSPACE

# Three independent fixtures for repeated GUI tests (TestConfig.loadForRun)
run.1.workspace=SEM_WORKSPACE_1
run.1.email=SEM_EMAIL_1
run.1.password=SEM_PASSWORD_1

run.2.workspace=SEM_WORKSPACE_2
run.2.email=SEM_EMAIL_2
run.2.password=SEM_PASSWORD_2

run.3.workspace=SEM_WORKSPACE_3
run.3.email=SEM_EMAIL_3
run.3.password=SEM_PASSWORD_3